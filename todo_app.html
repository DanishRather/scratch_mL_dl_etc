<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-size: 28px;
      color: #1a1a2e;
      margin-bottom: 24px;
      text-align: center;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-group input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #667eea;
    }

    .input-group button {
      padding: 12px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-group button:hover {
      background: #5a6fd6;
    }

    .todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #f8f9ff;
      border-radius: 8px;
      margin-bottom: 8px;
      transition: background 0.2s;
    }

    .todo-item:hover {
      background: #eef0ff;
    }

    .todo-item .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #667eea;
      cursor: pointer;
    }

    .todo-item .text {
      font-size: 15px;
      color: #333;
    }

    .todo-item .text.done {
      text-decoration: line-through;
      color: #999;
    }

    .todo-item .delete-btn {
      background: none;
      border: none;
      color: #ff6b6b;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .todo-item .delete-btn:hover {
      background: #ffe0e0;
    }

    .empty-msg {
      text-align: center;
      color: #999;
      font-size: 14px;
      padding: 20px 0;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 2px solid #f0f0f0;
      font-size: 13px;
      color: #666;
    }

    .clear-btn {
      background: none;
      border: 1px solid #e0e0e0;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: #ff6b6b;
      color: white;
      border-color: #ff6b6b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Todo</h1>
    <div class="input-group">
      <input type="text" id="todoInput" placeholder="Add a new task..." autofocus>
      <button id="addBtn">Add</button>
    </div>
    <ul class="todo-list" id="todoList">
      <li class="empty-msg">No tasks yet. Add one above!</li>
    </ul>
    <div class="stats">
      <span id="taskCount">0 tasks</span>
      <button class="clear-btn" id="clearBtn">Clear All</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');
    const todoList = document.getElementById('todoList');
    const taskCount = document.getElementById('taskCount');
    const clearBtn = document.getElementById('clearBtn');

    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

    function render() {
      todoList.innerHTML = '';
      if (tasks.length === 0) {
        todoList.innerHTML = '<li class="empty-msg">No tasks yet. Add one above!</li>';
      } else {
        tasks.forEach((task, index) => {
          const li = document.createElement('li');
          li.className = 'todo-item';
          li.innerHTML = `
            <div class="left">
              <input type="checkbox" ${task.done ? 'checked' : ''}>
              <span class="text ${task.done ? 'done' : ''}">${escapeHtml(task.text)}</span>
            </div>
            <button class="delete-btn">&times;</button>
          `;
          const checkbox = li.querySelector('input[type="checkbox"]');
          checkbox.addEventListener('change', () => toggleTask(index));
          li.querySelector('.delete-btn').addEventListener('click', () => deleteTask(index));
          todoList.appendChild(li);
        });
      }
      const done = tasks.filter(t => t.done).length;
      taskCount.textContent = `${tasks.length} tasks (${done} done)`;
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      input.value = '';
      input.focus();
      render();
    }

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      render();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      render();
    }

    function clearAll() {
      if (tasks.length === 0) return;
      if (confirm('Delete all tasks?')) {
        tasks = [];
        render();
      }
    }

    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
    clearBtn.addEventListener('click', clearAll);

    render();
  </script>
</body>
</html>
